name: Gerar APK Bella Gestao

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa
        run: flutter create . --platforms=android --org com.bellagestao

      - name: Forcar instalacao dos pacotes necessarios
        run: |
          flutter pub add provider sqflite path path_provider intl share_plus pdf
          flutter pub get

      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: bella-gestao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
