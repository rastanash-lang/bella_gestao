name: Gerar APK Bella Gestao

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa
        run: flutter create . --platforms=android --org com.bellagestao

      - name: Configurar Permissoes, Receivers e Desugaring para Notificacoes
        run: |
          python3 -c '
          import os, re
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r") as f:
                  c = f.read()
              
              # 1. Injeta permissoes no AndroidManifest
              perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              """
              if "POST_NOTIFICATIONS" not in c:
                  c = c.replace("<application", perms + "\n    <application")

              # 2. Injeta receivers nativos para disparar com o app fechado
              receivers = """
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
              """
              if "ScheduledNotificationReceiver" not in c:
                  c = c.replace("</application>", receivers + "\n    </application>")

              with open(manifest, "w") as f:
                  f.write(c)

          # 3. Configura compatibilidade de Java/Desugaring nos arquivos Gradle
          for grad in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(grad):
                  with open(grad, "r") as f:
                      gc = f.read()
                  if "coreLibraryDesugaring" not in gc:
                      is_kts = grad.endswith(".kts")
                      desug_dep = "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")" if is_kts else "    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\""
                      desug_opt = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
                      gc = re.sub(r"compileOptions\s*\{", f"compileOptions {{\n        {desug_opt}", gc)
                      if "dependencies {" in gc:
                          gc = gc.replace("dependencies {", f"dependencies {{\n{desug_dep}")
                      else:
                          gc += f"\ndependencies {{\n{desug_dep}\n}}\n"
                      with open(grad, "w") as f:
                          f.write(gc)
          '

      - name: Forcar instalacao dos pacotes necessarios
        run: |
          flutter pub add provider sqflite path path_provider intl share_plus pdf file_picker flutter_local_notifications timezone
          flutter pub get

      - name: Configurar Nome Oficial do App (Bella Gestão)
        run: |
          sed -i 's/android:label=".*"/android:label="Bella Gestão"/' android/app/src/main/AndroidManifest.xml

      - name: Gerar e Aplicar Ícone Oficial do Salão
        run: |
          python3 -c '
          import base64, os
          svg_icon = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="120" fill="#0F172A"/>
            <circle cx="256" cy="256" r="210" fill="#16A34A" fill-opacity="0.15" stroke="#16A34A" stroke-width="8"/>
            <path d="M190 140 C170 140 150 160 150 185 C150 210 170 230 190 230 C205 230 218 221 225 208 L280 290 L260 320 C245 320 230 335 230 355 C230 375 245 390 265 390 C285 390 300 375 300 355 C300 342 293 331 283 324 L305 290 L340 340 L360 340 L295 245 L360 150 L340 150 L275 245 L225 172 C218 153 205 140 190 140 Z M190 160 C202 160 210 170 210 185 C210 200 202 210 190 210 C178 210 170 200 170 185 C170 170 178 160 190 160 Z" fill="#F59E0B"/>
            <polygon points="380,180 390,205 415,215 390,225 380,250 370,225 345,215 370,205" fill="#FBBF24"/>
            <polygon points="130,300 137,315 152,322 137,329 130,344 123,329 108,322 123,315" fill="#FBBF24"/>
          </svg>"""
          
          os.system("sudo apt-get install -y imagemagick librsvg2-bin")
          with open("icon.svg", "w") as f:
            f.write(svg_icon)
          
          sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192
          }
          
          for folder, size in sizes.items():
            path = f"android/app/src/main/res/{folder}"
            os.makedirs(path, exist_ok=True)
            os.system(f"rsvg-convert -w {size} -h {size} icon.svg -o {path}/ic_launcher.png")
          '

      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download (Retencao de 1 dia)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bella-gestao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Criar Release Permanente para Download Direto
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.7-build-${{ github.run_number }}"
          name: "Bella Gestão v1.7 (Build ${{ github.run_number }})"
          body: "APK do aplicativo Bella Gestão com notificações de agenda, controle de estoque, gastos pessoais dedutíveis e saldo histórico."
          files: build/app/outputs/flutter-apk/app-release.apk
